<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON 格式化工具 - DevToolbox</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0f172a;
            --bg-card: #1e293b;
            --bg-card-hover: #26334d;
            --bg-input: #0b1221;
            --border: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --accent: #6366f1;
            --accent-hover: #818cf8;
            --accent-2: #10b981;
            --accent-3: #f59e0b;
            --accent-4: #ec4899;
            --accent-5: #06b6d4;
            --accent-6: #8b5cf6;
            --error: #ef4444;
            --success: #10b981;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            overflow: hidden;
        }

        /* 顶部导航栏 */
        .top-bar {
            height: 56px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            -webkit-app-region: drag;
        }

        .top-bar .left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .top-bar .logo {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--accent), var(--accent-6));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .top-bar .title {
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .top-bar .right {
            display: flex;
            align-items: center;
            gap: 8px;
            -webkit-app-region: no-drag;
        }

        .top-bar .btn-icon {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            font-size: 16px;
        }

        .top-bar .btn-icon:hover {
            background: var(--bg-card);
            color: var(--text-primary);
        }

        .top-bar .btn-close:hover {
            background: #ef4444;
            color: #fff;
        }

        /* 主布局 */
        .main-layout {
            display: flex;
            height: 100vh;
            padding-top: 56px;
        }

        /* 左侧边栏 */
        .sidebar {
            width: 220px;
            background: var(--bg-card);
            border-right: 1px solid var(--border);
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .sidebar-section {
            padding: 0 16px;
            margin-bottom: 8px;
        }

        .sidebar-section-title {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 8px 12px;
            margin-bottom: 4px;
        }

        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 2px;
            text-decoration: none;
        }

        .sidebar-item:hover {
            background: var(--bg-card-hover);
            color: var(--text-primary);
        }

        .sidebar-item.active {
            background: rgba(99, 102, 241, 0.15);
            color: var(--accent);
            font-weight: 500;
        }

        .sidebar-item i {
            font-size: 18px;
            width: 20px;
            text-align: center;
        }

        /* JSON 会话列表面板 */
        .session-panel {
            width: 260px;
            background: var(--bg-card);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .session-panel-header {
            padding: 20px 16px 12px;
            border-bottom: 1px solid var(--border);
        }

        .session-panel-header h2 {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        .btn-new {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px dashed var(--border);
            background: transparent;
            color: var(--text-secondary);
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .btn-new:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(99, 102, 241, 0.05);
        }

        .session-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .session-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-secondary);
            font-size: 13px;
            margin-bottom: 4px;
            position: relative;
            border: 1px solid transparent;
        }

        .session-item:hover {
            background: var(--bg-card-hover);
            color: var(--text-primary);
        }

        .session-item.active {
            background: rgba(99, 102, 241, 0.12);
            color: var(--accent);
            border-color: rgba(99, 102, 241, 0.3);
        }

        .session-item .session-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: rgba(99, 102, 241, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }

        .session-item.active .session-icon {
            background: var(--accent);
            color: #fff;
        }

        .session-item .session-info {
            flex: 1;
            min-width: 0;
        }

        .session-item .session-name {
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 2px;
        }

        .session-item .session-meta {
            font-size: 11px;
            opacity: 0.7;
        }

        .session-item .session-actions {
            display: flex;
            gap: 2px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .session-item:hover .session-actions {
            opacity: 1;
        }

        .session-actions button {
            width: 24px;
            height: 24px;
            border-radius: 4px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
        }

        .session-actions button:hover {
            background: rgba(255,255,255,0.1);
            color: var(--text-primary);
        }

        .session-actions .btn-delete:hover {
            background: rgba(239, 68, 68, 0.2);
            color: var(--error);
        }

        /* 主内容区 */
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .content-header {
            padding: 20px 24px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .content-header .left h1 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .content-header .left p {
            color: var(--text-secondary);
            font-size: 13px;
        }

        .content-header .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
        }

        .status-badge.valid {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
        }

        .status-badge.invalid {
            background: rgba(239, 68, 68, 0.15);
            color: var(--error);
        }

        /* 工具栏 */
        .toolbar {
            padding: 12px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .toolbar-btn {
            padding: 8px 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-secondary);
            font-size: 13px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .toolbar-btn:hover {
            background: var(--bg-card-hover);
            color: var(--text-primary);
            border-color: var(--accent);
        }

        .toolbar-btn.primary {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        .toolbar-btn.primary:hover {
            background: var(--accent-hover);
        }

        .toolbar-sep {
            width: 1px;
            height: 24px;
            background: var(--border);
            margin: 0 4px;
        }

        .toolbar-right {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .indent-select {
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-primary);
            font-size: 13px;
            outline: none;
            cursor: pointer;
        }

        /* 编辑器区域 */
        .editor-area {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        .editor-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
        }

        .editor-panel:last-child {
            border-right: none;
        }

        .panel-header {
            padding: 10px 16px;
            background: rgba(30, 41, 59, 0.6);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .panel-header .panel-actions {
            display: flex;
            gap: 4px;
        }

        .panel-header .panel-actions button {
            width: 24px;
            height: 24px;
            border-radius: 4px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .panel-header .panel-actions button:hover {
            background: rgba(255,255,255,0.1);
            color: var(--text-primary);
        }

        .panel-body {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .panel-body textarea, .panel-body .code-output {
            width: 100%;
            height: 100%;
            padding: 16px;
            border: none;
            outline: none;
            resize: none;
            font-family: 'SF Mono', Monaco, 'Cascadia Code', 'Roboto Mono', Consolas, 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.6;
            background: var(--bg-input);
            color: var(--text-primary);
        }

        .panel-body textarea::placeholder {
            color: var(--text-secondary);
            opacity: 0.5;
        }

        .code-output {
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }

        /* JSON 语法高亮 */
        .json-key { color: #93c5fd; }
        .json-string { color: #86efac; }
        .json-number { color: #fca5a5; }
        .json-boolean { color: #c4b5fd; }
        .json-null { color: #fda4af; }
        .json-brace { color: #e2e8f0; }
        .json-colon { color: #94a3b8; }
        .json-comma { color: #94a3b8; }

        /* 错误提示 */
        .error-toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            padding: 12px 18px;
            border-radius: 10px;
            background: var(--bg-card);
            border: 1px solid var(--error);
            color: var(--error);
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 200;
        }

        .error-toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .success-toast {
            border-color: var(--success);
            color: var(--success);
        }

        /* 空状态 */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-secondary);
            gap: 12px;
        }

        .empty-state i {
            font-size: 48px;
            opacity: 0.3;
        }

        .empty-state p {
            font-size: 14px;
        }

        /* 重命名输入 */
        .session-item input.rename-input {
            background: var(--bg);
            border: 1px solid var(--accent);
            border-radius: 4px;
            padding: 2px 6px;
            color: var(--text-primary);
            font-size: 13px;
            width: 100%;
            outline: none;
        }

        /* 滚动条 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }

        /* 响应式 */
        @media (max-width: 1100px) {
            .sidebar {
                width: 64px;
            }
            .sidebar-section-title,
            .sidebar-item span {
                display: none;
            }
            .sidebar-item {
                justify-content: center;
                padding: 10px;
            }
            .session-panel {
                width: 220px;
            }
        }

        @media (max-width: 900px) {
            .editor-area {
                flex-direction: column;
            }
            .editor-panel {
                border-right: none;
                border-bottom: 1px solid var(--border);
            }
        }
    </style>
</head>
<body>
    <!-- 顶部导航 -->
    <div class="top-bar">
        <div class="left">
            <div class="logo">
                <i class="ri-toolbox-line" style="color: #fff;"></i>
            </div>
            <span class="title">DevToolbox</span>
            <span style="color: var(--border); margin: 0 8px;">/</span>
            <span style="font-size: 14px; color: var(--text-secondary);">JSON 格式化</span>
        </div>
        <div class="right">
            <button class="btn-icon" title="设置"><i class="ri-settings-3-line"></i></button>
            <button class="btn-icon" title="最小化"><i class="ri-subtract-line"></i></button>
            <button class="btn-icon" title="最大化"><i class="ri-fullscreen-line"></i></button>
            <button class="btn-icon btn-close" title="关闭"><i class="ri-close-line"></i></button>
        </div>
    </div>

    <!-- 主布局 -->
    <div class="main-layout">
        <!-- 左侧导航边栏 -->
        <aside class="sidebar">
            <div class="sidebar-section">
                <div class="sidebar-section-title">分类</div>
                <a href="#" class="sidebar-item">
                    <i class="ri-apps-line"></i>
                    <span>全部工具</span>
                </a>
                <a href="#" class="sidebar-item active">
                    <i class="ri-code-box-line"></i>
                    <span>开发工具</span>
                </a>
                <a href="#" class="sidebar-item">
                    <i class="ri-image-line"></i>
                    <span>图片处理</span>
                </a>
                <a href="#" class="sidebar-item">
                    <i class="ri-file-text-line"></i>
                    <span>文本工具</span>
                </a>
                <a href="#" class="sidebar-item">
                    <i class="ri-shield-keyhole-line"></i>
                    <span>安全加密</span>
                </a>
                <a href="#" class="sidebar-item">
                    <i class="ri-database-2-line"></i>
                    <span>数据转换</span>
                </a>
            </div>
            <div class="sidebar-section">
                <div class="sidebar-section-title">收藏</div>
                <a href="#" class="sidebar-item">
                    <i class="ri-star-line"></i>
                    <span>我的收藏</span>
                </a>
                <a href="#" class="sidebar-item">
                    <i class="ri-history-line"></i>
                    <span>使用记录</span>
                </a>
            </div>
        </aside>

        <!-- JSON 会话列表面板 -->
        <div class="session-panel">
            <div class="session-panel-header">
                <h2>JSON 会话</h2>
                <button class="btn-new" onclick="createNewSession()">
                    <i class="ri-add-line"></i>
                    新建会话
                </button>
            </div>
            <div class="session-list" id="sessionList">
                <!-- 动态生成 -->
            </div>
        </div>

        <!-- 主内容 -->
        <main class="content">
            <div class="content-header">
                <div class="left">
                    <h1 id="currentTitle">
                        <i class="ri-json-line" style="color: var(--accent);"></i>
                        <span id="titleText">JSON 格式化</span>
                    </h1>
                    <p id="currentMeta">选择一个会话开始编辑</p>
                </div>
                <div id="statusArea">
                    <span class="status-badge valid" id="statusBadge" style="display: none;">
                        <i class="ri-check-line"></i> 有效 JSON
                    </span>
                </div>
            </div>

            <div class="toolbar">
                <button class="toolbar-btn primary" onclick="formatJSON()">
                    <i class="ri-braces-line"></i> 格式化
                </button>
                <button class="toolbar-btn" onclick="compressJSON()">
                    <i class="ri-compress-line"></i> 压缩
                </button>
                <button class="toolbar-btn" onclick="validateJSON()">
                    <i class="ri-shield-check-line"></i> 验证
                </button>
                <button class="toolbar-btn" onclick="escapeJSON()">
                    <i class="ri-code-line"></i> 转义
                </button>
                <button class="toolbar-btn" onclick="unescapeJSON()">
                    <i class="ri-file-code-line"></i> 去转义
                </button>
                <div class="toolbar-sep"></div>
                <button class="toolbar-btn" onclick="clearInput()">
                    <i class="ri-delete-bin-line"></i> 清空
                </button>
                <div class="toolbar-right">
                    <select class="indent-select" id="indentSelect" onchange="onIndentChange()">
                        <option value="2">2 空格缩进</option>
                        <option value="4" selected>4 空格缩进</option>
                        <option value="\t">Tab 缩进</option>
                    </select>
                    <button class="toolbar-btn" onclick="copyOutput()">
                        <i class="ri-file-copy-line"></i> 复制结果
                    </button>
                    <button class="toolbar-btn" onclick="downloadJSON()">
                        <i class="ri-download-line"></i> 导出
                    </button>
                </div>
            </div>

            <div class="editor-area">
                <div class="editor-panel">
                    <div class="panel-header">
                        <span><i class="ri-edit-line"></i> 输入</span>
                        <div class="panel-actions">
                            <button onclick="pasteInput()" title="粘贴"><i class="ri-clipboard-line"></i></button>
                            <button onclick="clearInput()" title="清空"><i class="ri-delete-bin-line"></i></button>
                        </div>
                    </div>
                    <div class="panel-body">
                        <textarea id="inputArea" placeholder="在此粘贴 JSON 数据..." oninput="onInputChange()"></textarea>
                    </div>
                </div>
                <div class="editor-panel">
                    <div class="panel-header">
                        <span><i class="ri-braces-line"></i> 输出</span>
                        <div class="panel-actions">
                            <button onclick="copyOutput()" title="复制"><i class="ri-file-copy-line"></i></button>
                            <button onclick="downloadJSON()" title="下载"><i class="ri-download-line"></i></button>
                        </div>
                    </div>
                    <div class="panel-body">
                        <div class="code-output" id="outputArea">
                            <div class="empty-state">
                                <i class="ri-braces-line"></i>
                                <p>格式化后的 JSON 将显示在这里</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 提示 -->
    <div class="error-toast" id="toast"></div>

    <script>
        // 会话数据管理
        let sessions = [];
        let activeSessionId = null;
        let indent = 4;

        const demoData = `{
    "name": "DevToolbox",
    "version": "1.0.0",
    "description": "开发者工具箱",
    "tools": [
        {
            "id": "json-formatter",
            "name": "JSON 格式化",
            "category": "development",
            "rating": 4.9,
            "features": ["格式化", "压缩", "验证", "语法高亮"]
        },
        {
            "id": "timestamp-converter",
            "name": "时间戳转换",
            "category": "development",
            "rating": 4.8
        }
    ],
    "author": {
        "name": "Developer",
        "email": "dev@example.com"
    },
    "license": "MIT",
    "isOpenSource": true,
    "stars": null
}`;

        // 初始化
        function init() {
            // 创建默认会话
            const defaultSession = createSession('示例数据', demoData);
            activeSessionId = defaultSession.id;
            renderSessionList();
            loadSession(activeSessionId);
        }

        function generateId() {
            return 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        }

        function createSession(name, content = '') {
            const session = {
                id: generateId(),
                name: name || '未命名 ' + (sessions.length + 1),
                content: content,
                createdAt: Date.now(),
                updatedAt: Date.now()
            };
            sessions.push(session);
            return session;
        }

        function createNewSession() {
            const session = createSession();
            activeSessionId = session.id;
            renderSessionList();
            loadSession(session.id);
            showToast('已创建新会话', 'success');
        }

        function deleteSession(id, event) {
            event.stopPropagation();
            if (sessions.length <= 1) {
                showToast('至少保留一个会话', 'error');
                return;
            }
            sessions = sessions.filter(s => s.id !== id);
            if (activeSessionId === id) {
                activeSessionId = sessions[0]?.id || null;
            }
            renderSessionList();
            if (activeSessionId) {
                loadSession(activeSessionId);
            } else {
                document.getElementById('inputArea').value = '';
                document.getElementById('outputArea').innerHTML = `
                    <div class="empty-state">
                        <i class="ri-braces-line"></i>
                        <p>格式化后的 JSON 将显示在这里</p>
                    </div>
                `;
            }
            showToast('会话已删除', 'success');
        }

        function renameSession(id, event) {
            event.stopPropagation();
            const session = sessions.find(s => s.id === id);
            if (!session) return;

            const item = document.querySelector(`[data-session-id="${id}"] .session-name`);
            const currentName = session.name;

            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'rename-input';
            input.value = currentName;
            input.onblur = function() {
                finishRename(id, this.value);
            };
            input.onkeydown = function(e) {
                if (e.key === 'Enter') {
                    this.blur();
                }
            };

            item.innerHTML = '';
            item.appendChild(input);
            input.focus();
            input.select();
        }

        function finishRename(id, newName) {
            const session = sessions.find(s => s.id === id);
            if (session && newName.trim()) {
                session.name = newName.trim();
                session.updatedAt = Date.now();
            }
            renderSessionList();
            if (activeSessionId === id) {
                document.getElementById('titleText').textContent = session.name;
            }
        }

        function renderSessionList() {
            const list = document.getElementById('sessionList');
            list.innerHTML = sessions.map(session => {
                const isActive = session.id === activeSessionId;
                const timeStr = formatTime(session.updatedAt);
                return `
                    <div class="session-item ${isActive ? 'active' : ''}" data-session-id="${session.id}" onclick="switchSession('${session.id}')">
                        <div class="session-icon">
                            <i class="ri-json-line"></i>
                        </div>
                        <div class="session-info">
                            <div class="session-name">${escapeHtml(session.name)}</div>
                            <div class="session-meta">${timeStr}</div>
                        </div>
                        <div class="session-actions">
                            <button onclick="renameSession('${session.id}', event)" title="重命名"><i class="ri-edit-line"></i></button>
                            <button class="btn-delete" onclick="deleteSession('${session.id}', event)" title="删除"><i class="ri-delete-bin-line"></i></button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function switchSession(id) {
            if (activeSessionId === id) return;
            // 保存当前会话内容
            saveCurrentSession();
            activeSessionId = id;
            renderSessionList();
            loadSession(id);
        }

        function loadSession(id) {
            const session = sessions.find(s => s.id === id);
            if (!session) return;

            document.getElementById('inputArea').value = session.content;
            document.getElementById('titleText').textContent = session.name;
            document.getElementById('currentMeta').textContent = `创建于 ${formatDate(session.createdAt)} · 共 ${sessions.length} 个会话`;

            if (session.content.trim()) {
                formatJSON();
            } else {
                document.getElementById('outputArea').innerHTML = `
                    <div class="empty-state">
                        <i class="ri-braces-line"></i>
                        <p>格式化后的 JSON 将显示在这里</p>
                    </div>
                `;
                hideStatus();
            }
        }

        function saveCurrentSession() {
            if (!activeSessionId) return;
            const session = sessions.find(s => s.id === activeSessionId);
            if (session) {
                session.content = document.getElementById('inputArea').value;
                session.updatedAt = Date.now();
            }
        }

        function onInputChange() {
            saveCurrentSession();
            // 实时格式化（可选，这里做防抖）
            clearTimeout(window._fmtTimer);
            window._fmtTimer = setTimeout(() => {
                const input = document.getElementById('inputArea').value.trim();
                if (input) {
                    formatJSON();
                }
            }, 500);
        }

        function onIndentChange() {
            const val = document.getElementById('indentSelect').value;
            indent = val === '\t' ? '\t' : parseInt(val);
            formatJSON();
        }

        // JSON 处理
        function formatJSON() {
            const input = document.getElementById('inputArea').value.trim();
            if (!input) {
                showToast('请输入 JSON 数据', 'error');
                return;
            }

            try {
                const obj = JSON.parse(input);
                const formatted = JSON.stringify(obj, null, indent);
                document.getElementById('outputArea').innerHTML = syntaxHighlight(formatted);
                showStatus(true);
                saveCurrentSession();
            } catch (e) {
                showStatus(false, e.message);
                document.getElementById('outputArea').innerHTML = `<span style="color: var(--error);">错误: ${escapeHtml(e.message)}</span>`;
            }
        }

        function compressJSON() {
            const input = document.getElementById('inputArea').value.trim();
            if (!input) return;

            try {
                const obj = JSON.parse(input);
                const compressed = JSON.stringify(obj);
                document.getElementById('outputArea').innerHTML = syntaxHighlight(compressed);
                showStatus(true);
                showToast('已压缩', 'success');
            } catch (e) {
                showStatus(false, e.message);
                showToast(e.message, 'error');
            }
        }

        function validateJSON() {
            const input = document.getElementById('inputArea').value.trim();
            if (!input) {
                showToast('请输入 JSON 数据', 'error');
                return;
            }

            try {
                JSON.parse(input);
                showStatus(true);
                showToast('JSON 格式有效 ✓', 'success');
            } catch (e) {
                showStatus(false, e.message);
                showToast(e.message, 'error');
            }
        }

        function escapeJSON() {
            const input = document.getElementById('inputArea').value;
            if (!input) return;
            const escaped = JSON.stringify(input);
            document.getElementById('outputArea').innerHTML = syntaxHighlight(escaped);
            showToast('已转义为 JSON 字符串', 'success');
        }

        function unescapeJSON() {
            const input = document.getElementById('inputArea').value.trim();
            if (!input) return;
            try {
                const unescaped = JSON.parse(input);
                if (typeof unescaped === 'string') {
                    document.getElementById('outputArea').textContent = unescaped;
                    showToast('已去除转义', 'success');
                } else {
                    document.getElementById('outputArea').innerHTML = syntaxHighlight(JSON.stringify(unescaped, null, indent));
                    showToast('解析成功', 'success');
                }
            } catch (e) {
                showToast(e.message, 'error');
            }
        }

        function clearInput() {
            document.getElementById('inputArea').value = '';
            document.getElementById('outputArea').innerHTML = `
                <div class="empty-state">
                    <i class="ri-braces-line"></i>
                    <p>格式化后的 JSON 将显示在这里</p>
                </div>
            `;
            hideStatus();
            saveCurrentSession();
        }

        async function pasteInput() {
            try {
                const text = await navigator.clipboard.readText();
                document.getElementById('inputArea').value = text;
                onInputChange();
                showToast('已粘贴', 'success');
            } catch (e) {
                showToast('无法读取剪贴板', 'error');
            }
        }

        async function copyOutput() {
            const output = document.getElementById('outputArea');
            let text = output.textContent;
            // 如果输出区是语法高亮的 HTML，提取纯文本
            if (output.querySelector('.json-key')) {
                text = output.innerText;
            }
            if (!text || text.includes('格式化后的 JSON 将显示在这里')) {
                showToast('没有可复制的内容', 'error');
                return;
            }
            try {
                await navigator.clipboard.writeText(text);
                showToast('已复制到剪贴板', 'success');
            } catch (e) {
                showToast('复制失败', 'error');
            }
        }

        function downloadJSON() {
            const output = document.getElementById('outputArea');
            let text = output.innerText;
            if (!text || text.includes('格式化后的 JSON 将显示在这里')) {
                text = document.getElementById('inputArea').value;
            }
            if (!text.trim()) {
                showToast('没有可导出的内容', 'error');
                return;
            }
            const blob = new Blob([text], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            const session = sessions.find(s => s.id === activeSessionId);
            a.download = (session?.name || 'data') + '.json';
            a.click();
            URL.revokeObjectURL(url);
            showToast('已开始下载', 'success');
        }

        // 语法高亮
        function syntaxHighlight(json) {
            if (!json) return '';
            json = json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            return json.replace(/("(\u[a-zA-Z0-9]{4}|\[^u]|[^\"])*"(\s*:)?|(true|false|null)|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?|[{}[\],]|\s+)/g, function (match) {
                let cls = 'json-other';
                if (/^"/.test(match)) {
                    if (/:$/.test(match)) {
                        cls = 'json-key';
                        match = match.slice(0, -1) + '<span class="json-colon">:</span>';
                    } else {
                        cls = 'json-string';
                    }
                } else if (/true|false/.test(match)) {
                    cls = 'json-boolean';
                } else if (/null/.test(match)) {
                    cls = 'json-null';
                } else if (/^-?\d/.test(match)) {
                    cls = 'json-number';
                } else if (/[{}[\]]/.test(match)) {
                    cls = 'json-brace';
                } else if (/,/.test(match)) {
                    cls = 'json-comma';
                }
                if (cls === 'json-key') {
                    return '<span class="' + cls + '">' + match + '</span>';
                }
                return '<span class="' + cls + '">' + match + '</span>';
            });
        }

        // UI 状态
        function showStatus(isValid, message) {
            const badge = document.getElementById('statusBadge');
            if (isValid) {
                badge.className = 'status-badge valid';
                badge.innerHTML = '<i class="ri-check-line"></i> 有效 JSON';
                badge.style.display = 'inline-flex';
            } else {
                badge.className = 'status-badge invalid';
                badge.innerHTML = '<i class="ri-error-warning-line"></i> ' + escapeHtml(message || '格式错误');
                badge.style.display = 'inline-flex';
            }
        }

        function hideStatus() {
            document.getElementById('statusBadge').style.display = 'none';
        }

        function showToast(message, type) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'error-toast ' + (type === 'success' ? 'success-toast' : '');
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        // 工具函数
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatTime(ts) {
            const now = Date.now();
            const diff = now - ts;
            if (diff < 60000) return '刚刚';
            if (diff < 3600000) return Math.floor(diff / 60000) + ' 分钟前';
            if (diff < 86400000) return Math.floor(diff / 3600000) + ' 小时前';
            return Math.floor(diff / 86400000) + ' 天前';
        }

        function formatDate(ts) {
            const d = new Date(ts);
            return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        }

        // 启动
        init();
    </script>
</body>
</html>
